# Configuración de análisis de SonarCloud para este monorepo (backend +
# frontend en un único proyecto de Sonar). La organización y la clave del
# proyecto son las que aparecen en la web de SonarCloud para este repo.
sonar.organization=dgnework
sonar.projectKey=dgNeWork_cortador

# Dónde está el código de verdad y dónde están los tests de cada lado.
sonar.sources=cortador-back/src/main/java,cortador-front/src
sonar.tests=cortador-back/src/test/java
# Dentro de cortador-front/src los tests están junto al código (no en una
# carpeta aparte), así que se reconocen por su nombre en vez de por ruta.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Necesario para que el analizador de Java entienda las clases compiladas
# (anotaciones, tipos...), no solo el texto fuente.
sonar.java.binaries=cortador-back/target/classes
sonar.java.test.binaries=cortador-back/target/test-classes

# Informes de cobertura: uno por cada lado, generados al ejecutar los
# tests (ver pom.xml para JaCoCo y vite.config.ts para Vitest).
sonar.coverage.jacoco.xmlReportPaths=cortador-back/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=cortador-front/coverage/lcov.info

# Nada de esto aporta valor al análisis: dependencias, artefactos de
# compilación y código generado por herramientas.
sonar.exclusions=cortador-front/node_modules/**,cortador-front/dist/**,cortador-front/coverage/**,cortador-back/target/**,cortador-back/.mvn/**
sonar.coverage.exclusions=cortador-front/src/main.tsx,cortador-front/src/vite-env.d.ts,cortador-back/src/main/java/com/cortador/back/CortadorBackApplication.java
