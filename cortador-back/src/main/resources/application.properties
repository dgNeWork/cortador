spring.application.name=cortador-back

# Conexión a la base de datos. Las credenciales salen de variables de
# entorno (nunca escritas a mano en el código), así pueden cambiar en cada
# máquina o entorno y no acaban subidas a git. Los valores por defecto
# (detrás de ":") son los de la base de datos local de desarrollo; en
# cualquier otro entorno se sustituyen con variables de entorno reales.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cortador_db}
spring.datasource.username=${DB_USERNAME:cortador_user}
spring.datasource.password=${DB_PASSWORD:cortador_dev_pw}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea y actualiza las tablas solo, a partir de las entidades.
# Vale para esta fase de desarrollo; antes de pasar a producción se
# cambiará por una herramienta de migraciones (por ejemplo, Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cuenta de admin: si no existe al arrancar, se crea sola con estos datos
# (ver AdminUserInitializer). El valor por defecto de la contraseña es solo
# para desarrollo local - cambiar ambas variables antes de desplegar.
admin.email=${ADMIN_EMAIL:admin@cortadorpro.example}
admin.password=${ADMIN_PASSWORD:changeme123}

# JWT: clave de firma y caducidad del token de sesión del admin (24h por
# defecto). La clave por defecto es solo para desarrollo local; en
# producción debe venir de una variable de entorno con un valor secreto.
jwt.secret=${JWT_SECRET:ewJkKzpSXvcwEQ+LgrzaPo6bubhDjR4MvNhMOYSGdpU=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Datos de muestra (catálogo de jamones, y más adelante tarifas y
# localidades) para que la app no arranque vacía. Solo rellena lo que esté
# vacío, nunca pisa lo que el cortador ya haya configurado. Los valores
# están en SampleDataInitializer.
app.sample-data.enabled=${SAMPLE_DATA_ENABLED:true}
