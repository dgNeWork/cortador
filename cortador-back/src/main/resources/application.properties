spring.application.name=cortador-back

# Database connection. Credentials come from environment variables (never
# hardcoded) so they can differ per machine/environment and never end up
# committed to git. Defaults after ":" match the local dev database created
# on this machine; override them with real env vars in any other environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cortador_db}
spring.datasource.username=${DB_USERNAME:cortador_user}
spring.datasource.password=${DB_PASSWORD:cortador_dev_pw}
spring.datasource.driver-class-name=org.postgresql.Driver

# Lets Hibernate create/update tables from the entities automatically.
# Fine for this stage of development; would be replaced by a proper
# migration tool (e.g. Flyway) before treating this as production-ready.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cuenta de admin: si no existe al arrancar, se crea sola con estos datos
# (ver AdminUserInitializer). El valor por defecto de la contraseña es solo
# para desarrollo local - cambiar ambas variables antes de desplegar.
admin.email=${ADMIN_EMAIL:admin@cortadorpro.example}
admin.password=${ADMIN_PASSWORD:changeme123}

# JWT: clave de firma y caducidad del token de sesión del admin (24h por
# defecto). La clave por defecto es solo para desarrollo local; en
# producción debe venir de una variable de entorno con un valor secreto.
jwt.secret=${JWT_SECRET:ewJkKzpSXvcwEQ+LgrzaPo6bubhDjR4MvNhMOYSGdpU=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
