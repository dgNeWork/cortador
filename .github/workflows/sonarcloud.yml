name: SonarCloud

# Se dispara con cada push a develop/main y en cada Pull Request, que es lo
# que sustituye al "Automatic Analysis" de SonarCloud: aquí SÍ se ejecutan
# los tests de verdad antes de mandar el resultado, así la cobertura que
# ve Sonar es la real y no una estimación.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial completo (no solo el último
          # commit) para poder calcular correctamente el código nuevo.
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: cortador-back/pom.xml

      - name: Ejecutar tests del backend y generar cobertura (JaCoCo)
        working-directory: cortador-back
        run: ./mvnw -B test

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: cortador-front/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: cortador-front
        run: npm ci

      - name: Ejecutar tests del frontend y generar cobertura (Vitest)
        working-directory: cortador-front
        run: npm run test:coverage

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
